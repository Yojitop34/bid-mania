
services:
  - type: web
    name: bid-mania
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run init-db; npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_DEFAULT_CODE
        sync: false
      - key: ADMIN_CODE_CHANGE_PASSWORD
        sync: false
